<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>基础日语语法知识网络 V3.0</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont,
    "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  background: #f4f7fb;
  color: #243247;
}

header {
  background: #ffffff;
  padding: 18px 28px;
  border-bottom: 1px solid #e3e8f0;
}

header h1 {
  margin: 0;
  font-size: 23px;
  color: #2459a6;
}

header p {
  margin: 8px 0 0;
  color: #718096;
  font-size: 13px;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 15px 25px;
  background: white;
  border-bottom: 1px solid #e3e8f0;
}

button, select {
  padding: 9px 15px;
  border-radius: 8px;
  border: 1px solid #d6dfeb;
  background: white;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background: #edf4ff;
}

button.active {
  background: #2459a6;
  color: white;
  border-color: #2459a6;
}

.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  height: calc(100vh - 145px);
  min-height: 500px;
}

.network-container {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle, #dce5f0 1px, transparent 1px);
  background-size: 24px 24px;
}

#network {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}

#network:active {
  cursor: grabbing;
}

.link {
  stroke: #aabbd0;
  stroke-width: 2;
}

.link.related {
  stroke: #e0a15c;
  stroke-dasharray: 6 5;
}

.node circle {
  stroke: white;
  stroke-width: 3;
  filter: drop-shadow(0 3px 5px rgba(0,0,0,.12));
}

.node text {
  text-anchor: middle;
  dominant-baseline: middle;
  font-size: 14px;
  font-weight: 600;
  pointer-events: none;
  fill: #26384f;
}

.node {
  cursor: pointer;
}

.node.selected circle {
  stroke: #f59e0b;
  stroke-width: 5;
}

.node.form circle {
  fill: #9fc7ff;
}

.node.sense circle {
  fill: #bce8d0;
}

.node.function circle {
  fill: #e6d4ff;
}

.node.focus circle {
  fill: #f9dca8;
}

.panel {
  background: white;
  border-left: 1px solid #e3e8f0;
  padding: 22px;
  overflow-y: auto;
}

.panel h2 {
  margin-top: 0;
  font-size: 20px;
  color: #2459a6;
}

.panel h3 {
  font-size: 15px;
  margin-top: 24px;
  margin-bottom: 8px;
  color: #41536b;
}

.panel p {
  line-height: 1.8;
  font-size: 14px;
}

.example {
  background: #f4f8ff;
  border-left: 4px solid #5a91d8;
  padding: 12px;
  border-radius: 5px;
  margin-top: 10px;
}

.example .jp {
  font-size: 16px;
  line-height: 1.8;
}

.example .cn {
  color: #64748b;
  margin-top: 6px;
  font-size: 14px;
}

.badge {
  display: inline-block;
  padding: 4px 9px;
  background: #edf3fc;
  color: #315f9e;
  border-radius: 6px;
  margin: 3px;
  font-size: 12px;
}

.notice {
  color: #8a651e;
  background: #fff7e8;
  padding: 10px;
  border-radius: 6px;
  font-size: 12px;
  line-height: 1.7;
}

.hint {
  position: absolute;
  left: 18px;
  bottom: 18px;
  background: rgba(255,255,255,.92);
  padding: 10px 14px;
  border-radius: 8px;
  color: #66788f;
  font-size: 12px;
}

.empty {
  color: #718096;
  line-height: 1.9;
}

@media (max-width: 800px) {
  .layout {
    grid-template-columns: 1fr;
    height: auto;
  }

  .network-container {
    height: 480px;
  }

  .panel {
    min-height: 320px;
    border-left: none;
    border-top: 1px solid #e3e8f0;
  }
}
</style>
</head>

<body>

<header>
  <h1>基础日语语法知识网络</h1>
  <p>V3.0 · 双重网络试验版 · 语法形式 × 语法功能</p>
</header>

<div class="toolbar">

  <button id="formBtn" class="active">
    语法形式网络
  </button>

  <button id="functionBtn">
    语法功能网络
  </button>

  <select id="focusSelect"></select>

  <button id="resetBtn">
    重置视图
  </button>

</div>

<div class="layout">

  <div class="network-container">

    <svg id="network">
      <g id="viewport">
        <g id="links"></g>
        <g id="nodes"></g>
      </g>
    </svg>

    <div class="hint">
      点击节点查看详情 · 拖动节点调整位置 · 滚轮缩放
    </div>

  </div>

  <aside class="panel" id="detailPanel">

    <h2>语法知识详情</h2>

    <p class="empty">
      请点击左侧网络中的节点。
      <br>
      可以查看语法意义、接续方式、
      教材课次、例句及中文译文。
    </p>

  </aside>

</div>

<script>

const DATA_URL = "./grammar-network-v3.json";

let data = null;

let currentMode = "form";
let currentFocus = null;

let graphNodes = [];
let graphLinks = [];

let selectedNodeId = null;

const svg = document.getElementById("network");
const viewport = document.getElementById("viewport");
const linksLayer = document.getElementById("links");
const nodesLayer = document.getElementById("nodes");

const detailPanel = document.getElementById("detailPanel");
const focusSelect = document.getElementById("focusSelect");

const SVG_NS = "http://www.w3.org/2000/svg";

let view = {
  x: 0,
  y: 0,
  scale: 1
};

let pointerState = null;
let suppressClick = false;

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getForm(id) {
  return data.grammar_forms.find(x => x.id === id);
}

function getSense(id) {
  return data.grammar_senses.find(x => x.id === id);
}

function getFunction(id) {
  return data.grammar_functions.find(x => x.id === id);
}

function getOccurrences(senseId) {
  return data.grammar_occurrences.filter(
    x => x.sense_id === senseId
  );
}

function getSenseRelations(senseId) {
  return data.grammar_relations.filter(
    x => x.source_id === senseId ||
         x.target_id === senseId
  );
}

function setMode(mode) {
  currentMode = mode;

  document.getElementById("formBtn")
    .classList.toggle("active", mode === "form");

  document.getElementById("functionBtn")
    .classList.toggle("active", mode === "function");

  const items = mode === "form"
    ? data.grammar_forms
    : data.grammar_functions;

  focusSelect.innerHTML = "";

  items.forEach(item => {
    const option = document.createElement("option");
    option.value = item.id;
    option.textContent = mode === "form"
      ? item.form
      : item.name;
    focusSelect.appendChild(option);
  });

  currentFocus = items[0]?.id || null;

  focusSelect.value = currentFocus || "";

  buildGraph();
}

function buildGraph() {
  graphNodes = [];
  graphLinks = [];
  selectedNodeId = null;

  if (!currentFocus) {
    renderGraph();
    return;
  }

  if (currentMode === "form") {
    buildFormGraph();
  } else {
    buildFunctionGraph();
  }

  function layoutGraph() {
  const width = svg.clientWidth || 900;
  const height = svg.clientHeight || 600;

  // 第一步：为所有节点设置有效的初始坐标
  graphNodes.forEach((node, index) => {
    node.x = width / 2;
    node.y = height / 2 + index * 10;
  });

  // 语法功能网络：保留环形布局
  if (currentMode === "function") {
    const focus = graphNodes.find(
      node => node.id === currentFocus
    );

    if (focus) {
      focus.x = width / 2;
      focus.y = height / 2;
    }

    const others = graphNodes.filter(
      node => node.id !== currentFocus
    );

    const count = others.length;

    if (count === 0) return;

    const radius = Math.max(160, count * 35);

    others.forEach((node, index) => {
      const angle =
        (2 * Math.PI * index / count) - Math.PI / 2;

      node.x = width / 2 + Math.cos(angle) * radius;
      node.y = height / 2 + Math.sin(angle) * radius;
    });

    return;
  }

  // 语法形式网络：树状布局
  const focus = graphNodes.find(
    node => node.id === currentFocus
  );

  if (!focus) return;

  // 第一层：语法形式
  focus.x = width / 2;
  focus.y = 80;

  // 第二层：属于当前语法形式的义项
  const mainSenses = graphNodes.filter(node => {
    const sense = getSense(node.id);

    return sense &&
      sense.grammar_form_id === currentFocus;
  });

  const spacing = 180;
  const count = mainSenses.length;

  mainSenses.forEach((node, index) => {
    node.x =
      width / 2 +
      (index - (count - 1) / 2) * spacing;

    node.y = 260;
  });

  // 第三层：关联的其他语法义项
  const mainIds = new Set(
    mainSenses.map(node => node.id)
  );

  const relatedNodes = graphNodes.filter(
    node =>
      node.id !== currentFocus &&
      !mainIds.has(node.id)
  );

  const relatedCount = relatedNodes.length;

  relatedNodes.forEach((node, index) => {
    node.x =
      width / 2 +
      (index - (relatedCount - 1) / 2) * spacing;

    node.y = 440;
  });
}
  resetView();
  renderGraph();
  showWelcome();
}

function buildFormGraph() {
  const form = getForm(currentFocus);

  if (!form) return;

  graphNodes.push({
    id: form.id,
    label: form.form,
    type: "focus",
    radius: 35
  });

  const senses = data.grammar_senses.filter(
    x => x.grammar_form_id === form.id
  );

  senses.forEach(sense => {
    graphNodes.push({
      id: sense.id,
      label: sense.meaning,
      type: "sense",
      radius: 30
    });

    graphLinks.push({
      source: form.id,
      target: sense.id,
      type: "normal"
    });
  });

  const senseIds = new Set(senses.map(x => x.id));

  data.grammar_relations.forEach(rel => {
    const sourceIn = senseIds.has(rel.source_id);
    const targetIn = senseIds.has(rel.target_id);

    if (!sourceIn && !targetIn) return;

    const otherId = sourceIn
      ? rel.target_id
      : rel.source_id;

    const otherSense = getSense(otherId);

    if (!otherSense) return;

    if (!graphNodes.some(x => x.id === otherId)) {
      const otherForm = getForm(otherSense.grammar_form_id);

      graphNodes.push({
        id: otherId,
        label: (otherForm?.form || "") +
          "：" + otherSense.meaning,
        type: "sense",
        radius: 30
      });
    }

    graphLinks.push({
      source: rel.source_id,
      target: rel.target_id,
      type: "related"
    });
  });
}

function buildFunctionGraph() {
  const func = getFunction(currentFocus);

  if (!func) return;

  graphNodes.push({
    id: func.id,
    label: func.name,
    type: "focus",
    radius: 42
  });

  const links = data.function_links.filter(
    x => x.function_id === func.id
  );

  const formIds = new Set();

  links.forEach(link => {
    const sense = getSense(link.sense_id);
    if (!sense) return;

    formIds.add(sense.grammar_form_id);

    graphNodes.push({
      id: sense.id,
      label: sense.meaning,
      type: "sense",
      radius: 30
    });

    graphLinks.push({
      source: func.id,
      target: sense.id,
      type: "normal"
    });
  });

  formIds.forEach(formId => {
    const form = getForm(formId);
    if (!form) return;

    graphNodes.push({
      id: form.id,
      label: form.form,
      type: "form",
      radius: 30
    });
  });

  links.forEach(link => {
    const sense = getSense(link.sense_id);
    if (!sense) return;

    graphLinks.push({
      source: sense.grammar_form_id,
      target: sense.id,
      type: "normal"
    });
  });

  const visibleIds = new Set(graphNodes.map(x => x.id));

  data.grammar_relations.forEach(rel => {
    if (
      visibleIds.has(rel.source_id) &&
      visibleIds.has(rel.target_id)
    ) {
      graphLinks.push({
        source: rel.source_id,
        target: rel.target_id,
        type: "related"
      });
    }
  });
}

function layoutGraph() {
  const width = svg.clientWidth || 900;
  const height = svg.clientHeight || 600;

  const cx = width / 2;
  const cy = height / 2;

  const focus = graphNodes.find(
    x => x.id === currentFocus
  );

  if (focus) {
    focus.x = cx;
    focus.y = cy;
  }

  const others = graphNodes.filter(
    x => x.id !== currentFocus
  );

  const count = others.length;

  if (!count) return;

  const radius = Math.min(
    Math.max(155, count * 30),
    Math.max(155, Math.min(width, height) * 0.38)
  );

  others.forEach((node, index) => {
    const angle =
      (Math.PI * 2 * index / count) - Math.PI / 2;

    node.x = cx + Math.cos(angle) * radius;
    node.y = cy + Math.sin(angle) * radius;
  });
}

function createSVGElement(tag, attrs = {}) {
  const element = document.createElementNS(SVG_NS, tag);

  Object.entries(attrs).forEach(([key, value]) => {
    element.setAttribute(key, value);
  });

  return element;
}

function renderGraph() {
  linksLayer.innerHTML = "";
  nodesLayer.innerHTML = "";

  graphLinks.forEach(link => {
    const source = graphNodes.find(
      x => x.id === link.source
    );

    const target = graphNodes.find(
      x => x.id === link.target
    );

    if (!source || !target) return;

    const line = createSVGElement("line", {
      x1: source.x,
      y1: source.y,
      x2: target.x,
      y2: target.y,
      class: "link " +
        (link.type === "related" ? "related" : "")
    });

    linksLayer.appendChild(line);
  });

  graphNodes.forEach(node => {
    const group = createSVGElement("g", {
      class: "node " + node.type +
        (selectedNodeId === node.id ? " selected" : ""),
      transform: `translate(${node.x},${node.y})`
    });

    const circle = createSVGElement("circle", {
      r: node.radius
    });

    group.appendChild(circle);

    const label = createSVGElement("text");

    const maxLength = node.type === "focus" ? 8 : 7;

    const text = node.label;

    if (text.length > maxLength) {
      const first = createSVGElement("tspan", {
        x: 0,
        dy: "-0.5em"
      });

      first.textContent = text.slice(0, maxLength);

      const second = createSVGElement("tspan", {
        x: 0,
        dy: "1.2em"
      });

      second.textContent = text.slice(maxLength, maxLength * 2);

      label.appendChild(first);
      label.appendChild(second);

      if (text.length > maxLength * 2) {
        const third = createSVGElement("tspan", {
          x: 0,
          dy: "1.2em"
        });

        third.textContent = "…";
        label.appendChild(third);
      }

    } else {
      label.textContent = text;
    }

    group.appendChild(label);

    group.addEventListener("pointerdown", event => {
      if (event.button !== 0) return;

      event.stopPropagation();

      pointerState = {
        type: "node",
        node,
        startX: event.clientX,
        startY: event.clientY,
        originX: node.x,
        originY: node.y,
        moved: false
      };

      svg.setPointerCapture(event.pointerId);
    });

    group.addEventListener("click", event => {
      event.stopPropagation();

      if (suppressClick) {
        suppressClick = false;
        return;
      }

      selectNode(node.id);
    });

    nodesLayer.appendChild(group);
  });

  updateTransform();
}

function updateTransform() {
  viewport.setAttribute(
    "transform",
    `translate(${view.x},${view.y}) scale(${view.scale})`
  );
}

function resetView() {
  const width = svg.clientWidth || 900;
  const height = svg.clientHeight || 600;

  if (!graphNodes.length) {
    view = { x: 0, y: 0, scale: 1 };
    updateTransform();
    return;
  }

  // 根据节点的实际位置和半径计算边界
  const minX = Math.min(
    ...graphNodes.map(n => n.x - n.radius)
  );

  const maxX = Math.max(
    ...graphNodes.map(n => n.x + n.radius)
  );

  const minY = Math.min(
    ...graphNodes.map(n => n.y - n.radius)
  );

  const maxY = Math.max(
    ...graphNodes.map(n => n.y + n.radius)
  );

  const graphWidth = Math.max(1, maxX - minX);
  const graphHeight = Math.max(1, maxY - minY);

  // 为节点和标签预留边距
  const padding = 50;

  const availableWidth = Math.max(1, width - padding * 2);
  const availableHeight = Math.max(1, height - padding * 2);

  // 自动缩放，确保网络完整显示
  const scale = Math.min(
    1,
    availableWidth / graphWidth,
    availableHeight / graphHeight
  );

  // 将整个网络居中
  view.scale = scale;

  view.x =
    width / 2 -
    ((minX + maxX) / 2) * scale;

  view.y =
    height / 2 -
    ((minY + maxY) / 2) * scale;

  updateTransform();
}


function selectNode(id) {
  selectedNodeId = id;

  renderGraph();

  const sense = getSense(id);

  if (sense) {
    showSense(sense);
    return;
  }

  const form = getForm(id);

  if (form) {
    showForm(form);
    return;
  }

  const func = getFunction(id);

  if (func) {
    showFunction(func);
  }
}

function showSense(sense) {
  const form = getForm(sense.grammar_form_id);
  const occurrences = getOccurrences(sense.id);
  const relations = getSenseRelations(sense.id);

  const functions = data.function_links
    .filter(x => x.sense_id === sense.id)
    .map(x => getFunction(x.function_id))
    .filter(Boolean);

  let html = `
    <h2>${escapeHTML(form?.form)}：${escapeHTML(sense.meaning)}</h2>

    <h3>语法类别</h3>
    <p>${escapeHTML(form?.category)}</p>

    <h3>接续方式</h3>
    <p>${escapeHTML(sense.connection)}</p>

    <h3>语法功能</h3>
    <p>
      ${functions.map(x =>
        `<span class="badge">${escapeHTML(x.name)}</span>`
      ).join("") || "尚未分类"}
    </p>
  `;

  html += `<h3>教材课次与例句</h3>`;

  if (!occurrences.length) {
    html += `<p>暂无教材记录。</p>`;
  }

  occurrences.forEach(item => {
    html += `
      <div class="example">
        <strong>第${escapeHTML(item.lesson)}课</strong>
        <span class="badge">
          页码：${item.page == null
            ? "待核实"
            : escapeHTML(item.page)}
        </span>

        <div class="jp">${escapeHTML(item.example)}</div>
        <div class="cn">${escapeHTML(item.translation)}</div>

        <div class="notice">
          ${item.source_type === "supplementary"
            ? "教学补充例句，非已核实教材原句"
            : "来源类型：" + escapeHTML(item.source_type)}
          <br>
          ${item.verified
            ? "已核实"
            : "教材出处尚未核实"}
        </div>
      </div>
    `;
  });

  if (relations.length) {
    html += `<h3>相关语法</h3>`;

    relations.forEach(rel => {
      const otherId = rel.source_id === sense.id
        ? rel.target_id
        : rel.source_id;

      const otherSense = getSense(otherId);
      const otherForm = otherSense
        ? getForm(otherSense.grammar_form_id)
        : null;

      html += `
        <p>
          <strong>
            ${escapeHTML(otherForm?.form)}：
            ${escapeHTML(otherSense?.meaning)}
          </strong>
          <br>
          ${escapeHTML(rel.description)}
          <br>
          <span class="badge">
            ${rel.type === "contrast" ? "对比关系" : "相关关系"}
          </span>
          <span class="badge">
            ${rel.status === "proposed" ? "待审核" : escapeHTML(rel.status)}
          </span>
        </p>
      `;
    });
  }

  detailPanel.innerHTML = html;
}

function showForm(form) {
  const senses = data.grammar_senses.filter(
    x => x.grammar_form_id === form.id
  );

  detailPanel.innerHTML = `
    <h2>语法形式：${escapeHTML(form.form)}</h2>

    <h3>语法类别</h3>
    <p>${escapeHTML(form.category)}</p>

    <h3>已收录义项</h3>

    ${senses.map(s => `
      <p>
        <span class="badge">${escapeHTML(s.meaning)}</span>
      </p>
    `).join("")}

    <p class="empty">
      点击网络中的绿色义项节点，
      可以查看接续方式、教材课次及例句。
    </p>
  `;
}

function showFunction(func) {
  const links = data.function_links.filter(
    x => x.function_id === func.id
  );

  const items = links.map(link => {
    const sense = getSense(link.sense_id);
    const form = sense
      ? getForm(sense.grammar_form_id)
      : null;

    return { sense, form };
  }).filter(x => x.sense && x.form);

  detailPanel.innerHTML = `
    <h2>${escapeHTML(func.name)}</h2>

    <h3>相关语法</h3>

    ${items.map(x => `
      <p>
        <span class="badge">${escapeHTML(x.form.form)}</span>
        ${escapeHTML(x.sense.meaning)}
      </p>
    `).join("")}

    <p class="empty">
      点击具体义项，查看不同语法的表达特点。
    </p>
  `;
}

function showWelcome() {

svg.addEventListener("pointerdown", event => {
  if (event.button !== 0) return;

  pointerState = {
    type: "pan",
    startX: event.clientX,
    startY: event.clientY,
    originX: view.x,
    originY: view.y,
    moved: false
  };

  svg.setPointerCapture(event.pointerId);
});

svg.addEventListener("pointermove", event => {
  if (!pointerState) return;

  const dx = event.clientX - pointerState.startX;
  const dy = event.clientY - pointerState.startY;

  if (Math.abs(dx) + Math.abs(dy) > 4) {
    pointerState.moved = true;
  }

  if (pointerState.type === "pan") {
    view.x = pointerState.originX + dx;
    view.y = pointerState.originY + dy;
    updateTransform();
  }

  if (pointerState.type === "node") {
    const node = pointerState.node;

    node.x = pointerState.originX + dx / view.scale;
    node.y = pointerState.originY + dy / view.scale;

    renderGraph();
  }
});

function finishPointer() {
  if (!pointerState) return;

  const state = pointerState;
  pointerState = null;

  if (state.type === "node") {
    if (state.moved) {
      suppressClick = true;
      setTimeout(() => {
        suppressClick = false;
      }, 100);
    } else {
      selectNode(state.node.id);
      suppressClick = true;
      setTimeout(() => {
        suppressClick = false;
      }, 100);
    }
  }
}

svg.addEventListener("pointerup", finishPointer);
svg.addEventListener("pointercancel", finishPointer);

svg.addEventListener("wheel", event => {
  event.preventDefault();

  const rect = svg.getBoundingClientRect();

  const mx = event.clientX - rect.left;
  const my = event.clientY - rect.top;

  const oldScale = view.scale;

  const factor = event.deltaY < 0 ? 1.1 : 0.9;

  const newScale = Math.min(
    3,
    Math.max(0.35, oldScale * factor)
  );

  const worldX = (mx - view.x) / oldScale;
  const worldY = (my - view.y) / oldScale;

  view.scale = newScale;
  view.x = mx - worldX * newScale;
  view.y = my - worldY * newScale;

  updateTransform();
}, { passive: false });

document.getElementById("formBtn")
  .addEventListener("click", () => setMode("form"));

document.getElementById("functionBtn")
  .addEventListener("click", () => setMode("function"));

focusSelect.addEventListener("change", event => {
  currentFocus = event.target.value;
  buildGraph();
});

document.getElementById("resetBtn")
  .addEventListener("click", () => {
    buildGraph();
  });

async function init() {
  try {
    const response = await fetch(DATA_URL, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        "无法读取语法数据文件，HTTP状态：" + response.status
      );
    }

    data = await response.json();

    const requiredArrays = [
      "grammar_forms",
      "grammar_senses",
      "grammar_functions",
      "function_links",
      "grammar_occurrences",
      "grammar_relations"
    ];

    for (const key of requiredArrays) {
      if (!Array.isArray(data[key])) {
        throw new Error("数据结构缺少：" + key);
      }
    }

    setMode("form");

  } catch (error) {
    console.error(error);
    showError(error.message);
  }
}

init();

</script>
