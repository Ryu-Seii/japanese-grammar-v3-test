<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基础日语语法知识网络 V3.0</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;background:#f4f7fb;color:#243247}header{background:white;padding:18px 26px;border-bottom:1px solid #e3e8f0}h1{margin:0;font-size:23px;color:#2459a6}header p{margin:7px 0 0;color:#718096;font-size:13px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 24px;background:white;border-bottom:1px solid #e3e8f0}button,select{padding:10px 14px;border-radius:8px;border:1px solid #d6dfeb;background:white;font-size:14px;cursor:pointer}button.active{background:#2459a6;border-color:#2459a6;color:white}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:calc(100vh - 155px);min-height:500px}.network-container{position:relative;overflow:hidden;background:radial-gradient(circle,#dce5f0 1px,transparent 1px);background-size:24px 24px}#network{display:block;width:100%;height:100%;touch-action:none;cursor:grab}#network:active{cursor:grabbing}.link{stroke:#aabbd0;stroke-width:2;fill:none}.link.related{stroke:#e0a15c;stroke-dasharray:6 5}.node{cursor:pointer}.node circle{stroke:white;stroke-width:3;filter:drop-shadow(0 3px 5px rgba(0,0,0,.12))}.node.selected circle{stroke:#f59e0b;stroke-width:5}.node.focus circle{fill:#f9dca8}.node.sense circle{fill:#bce8d0}.node.form circle{fill:#9fc7ff}.node.function circle{fill:#e6d4ff}.node text{text-anchor:middle;dominant-baseline:middle;font-size:13px;font-weight:600;pointer-events:none;fill:#26384f}.panel{background:white;border-left:1px solid #e3e8f0;padding:22px;overflow-y:auto}.panel h2{margin:0 0 14px;font-size:20px;color:#2459a6}.panel h3{font-size:15px;margin:22px 0 8px;color:#41536b}.panel p{font-size:14px;line-height:1.8}.example{background:#f4f8ff;border-left:4px solid #5a91d8;padding:12px;border-radius:5px;margin-top:10px}.jp{font-size:16px;line-height:1.8}.cn{font-size:14px;color:#64748b;margin-top:5px}.badge{display:inline-block;padding:4px 9px;margin:3px;background:#edf3fc;color:#315f9e;border-radius:6px;font-size:12px}.notice{background:#fff7e8;color:#8a651e;padding:10px;border-radius:6px;font-size:12px;line-height:1.7}.empty{color:#718096;line-height:1.9}.hint{position:absolute;bottom:16px;left:16px;background:rgba(255,255,255,.94);padding:9px 12px;border-radius:7px;color:#66788f;font-size:12px;pointer-events:none}@media(max-width:800px){.layout{display:block;height:auto}.network-container{height:520px}.panel{min-height:280px;border-left:0;border-top:1px solid #e3e8f0}}
</style>
</head>
<body>
<header><h1>基础日语语法知识网络</h1><p>V3.0.2 · 布局修复验证版 · 语法形式 × 语法功能</p></header>
<div class="toolbar"><button id="formBtn" class="active">语法形式网络</button><button id="functionBtn">语法功能网络</button><select id="focusSelect" aria-label="选择中心语法"></select><button id="resetBtn">重置视图</button></div>
<div class="layout"><div class="network-container"><svg id="network" aria-label="交互式语法知识网络"><g id="viewport"><g id="links"></g><g id="nodes"></g></g></svg><div class="hint">点击节点查看详情 · 拖动节点调整位置 · 滚轮缩放</div></div><aside class="panel" id="detailPanel"><h2>语法知识详情</h2><p class="empty">正在加载语法数据……</p></aside></div>
<script>
"use strict";
const DATA_URL = "./grammar-network-v3.json";
console.info("Grammar Network V3.0.2 loaded");
const SVG_NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("network");
const viewport = document.getElementById("viewport");
const linksLayer = document.getElementById("links");
const nodesLayer = document.getElementById("nodes");
const detailPanel = document.getElementById("detailPanel");
const focusSelect = document.getElementById("focusSelect");
let data = null, currentMode = "form", currentFocus = null;
let graphNodes = [], graphLinks = [], selectedNodeId = null;
let view = {x:0,y:0,scale:1}, pointerState = null;
const esc = v => String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const formById = id => data.grammar_forms.find(x => x.id === id);
const senseById = id => data.grammar_senses.find(x => x.id === id);
const functionById = id => data.grammar_functions.find(x => x.id === id);
function el(tag,attrs={}){const e=document.createElementNS(SVG_NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));return e;}
function dimensions(){return {width:svg.clientWidth||900,height:svg.clientHeight||600};}
function setMode(mode){
  currentMode=mode;
  document.getElementById("formBtn").classList.toggle("active",mode==="form");
  document.getElementById("functionBtn").classList.toggle("active",mode==="function");
  const items=mode==="form"?data.grammar_forms:data.grammar_functions;
  focusSelect.replaceChildren();
  for(const item of items){const o=document.createElement("option");o.value=item.id;o.textContent=mode==="form"?item.form:item.name;focusSelect.appendChild(o);}
  currentFocus=items[0]?.id??null;
  buildGraph();
}
function buildGraph(){
  graphNodes=[];graphLinks=[];selectedNodeId=null;pointerState=null;
  if(currentFocus){if(currentMode==="form")buildFormGraph();else buildFunctionGraph();}
  layoutGraph();
  resetView();
  renderGraph();
  showWelcome();
  console.info("V3.0.2 layout check", {nodes:graphNodes.length, view, positions:graphNodes.map(n=>[n.id,n.x,n.y])});
}
function addNode(id,label,type,radius){if(!graphNodes.some(n=>n.id===id))graphNodes.push({id,label,type,radius,x:0,y:0});}
function addLink(source,target,type="normal"){if(!graphLinks.some(l=>l.source===source&&l.target===target&&l.type===type))graphLinks.push({source,target,type});}
function buildFormGraph(){
  const form=formById(currentFocus);if(!form)return;
  addNode(form.id,form.form,"focus",38);
  const senses=data.grammar_senses.filter(s=>s.grammar_form_id===form.id);
  for(const s of senses){addNode(s.id,s.meaning,"sense",37);addLink(form.id,s.id);}
  const ids=new Set(senses.map(s=>s.id));
  for(const r of data.grammar_relations){
    if(!ids.has(r.source_id)&&!ids.has(r.target_id))continue;
    const otherId=ids.has(r.source_id)?r.target_id:r.source_id;
    const other=senseById(otherId);if(!other)continue;
    const otherForm=formById(other.grammar_form_id);
    addNode(other.id,`${otherForm?.form??""}：${other.meaning}`,"sense",37);
    addLink(r.source_id,r.target_id,"related");
  }
}
function buildFunctionGraph(){
  const func=functionById(currentFocus);if(!func)return;
  addNode(func.id,func.name,"focus",44);
  const matches=data.function_links.filter(l=>l.function_id===func.id);
  for(const link of matches){
    const sense=senseById(link.sense_id);if(!sense)continue;
    const form=formById(sense.grammar_form_id);
    addNode(sense.id,sense.meaning,"sense",37);
    addLink(func.id,sense.id);
    if(form){addNode(form.id,form.form,"form",34);addLink(form.id,sense.id);}
  }
  const ids=new Set(graphNodes.map(n=>n.id));
  for(const r of data.grammar_relations){if(ids.has(r.source_id)&&ids.has(r.target_id))addLink(r.source_id,r.target_id,"related");}
}
function distribute(nodes,y,spacing,cx){nodes.forEach((n,i)=>{n.x=cx+(i-(nodes.length-1)/2)*spacing;n.y=y;});}
function layoutGraph(){
  const {width}=dimensions(),cx=width/2;
  // 每个节点均获得有限坐标，避免undefined和NaN。
  graphNodes.forEach((n,i)=>{n.x=cx;n.y=150+i*90;n.radius=Number.isFinite(n.radius)?n.radius:36;});
  const focus=graphNodes.find(n=>n.id===currentFocus);
  if(!focus)return;
  if(currentMode==="form"){
    focus.x=cx;focus.y=90;
    const main=graphNodes.filter(n=>senseById(n.id)?.grammar_form_id===currentFocus);
    distribute(main,285,185,cx);
    const mainIds=new Set(main.map(n=>n.id));
    const related=graphNodes.filter(n=>n.id!==currentFocus&&!mainIds.has(n.id));
    distribute(related,480,185,cx);
  }else{
    focus.x=cx;focus.y=90;
    const senses=graphNodes.filter(n=>n.type==="sense");
    const forms=graphNodes.filter(n=>n.type==="form");
    distribute(senses,285,185,cx);
    distribute(forms,480,185,cx);
  }
}
function updateTransform(){
  if(!Number.isFinite(view.x)||!Number.isFinite(view.y)||!Number.isFinite(view.scale)||view.scale<=0)view={x:0,y:0,scale:1};
  viewport.setAttribute("transform",`translate(${view.x},${view.y}) scale(${view.scale})`);
}
function resetView(){
  const {width,height}=dimensions();
  const valid=graphNodes.filter(n=>Number.isFinite(n.x)&&Number.isFinite(n.y)&&Number.isFinite(n.radius));
  if(!valid.length){view={x:0,y:0,scale:1};updateTransform();return;}
  const minX=Math.min(...valid.map(n=>n.x-n.radius-12)),maxX=Math.max(...valid.map(n=>n.x+n.radius+12));
  const minY=Math.min(...valid.map(n=>n.y-n.radius-12)),maxY=Math.max(...valid.map(n=>n.y+n.radius+12));
  const pad=55;
  const scale=Math.min(1,Math.max(.15,(width-2*pad)/Math.max(1,maxX-minX)),Math.max(.15,(height-2*pad)/Math.max(1,maxY-minY)));
  view={scale,x:width/2-(minX+maxX)/2*scale,y:height/2-(minY+maxY)/2*scale};
  updateTransform();
}
function renderGraph(){
  linksLayer.replaceChildren();nodesLayer.replaceChildren();
  for(const link of graphLinks){
    const a=graphNodes.find(n=>n.id===link.source),b=graphNodes.find(n=>n.id===link.target);
    if(!a||!b||![a.x,a.y,b.x,b.y].every(Number.isFinite))continue;
    linksLayer.appendChild(el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y,class:`link ${link.type==="related"?"related":""}`}));
  }
  for(const node of graphNodes){
    if(!Number.isFinite(node.x)||!Number.isFinite(node.y))continue;
    const g=el("g",{class:`node ${node.type}${selectedNodeId===node.id?" selected":""}`,transform:`translate(${node.x},${node.y})`});
    g.appendChild(el("circle",{r:node.radius}));
    const label=el("text");
    const chunks=[];const chars=Array.from(node.label);
    for(let i=0;i<chars.length&&chunks.length<3;i+=7)chunks.push(chars.slice(i,i+7).join(""));
    if(chars.length>21)chunks[2]=chunks[2].slice(0,6)+"…";
    chunks.forEach((part,i)=>{const t=el("tspan",{x:0,dy:i===0?`${-(chunks.length-1)*.6}em`:"1.2em"});t.textContent=part;label.appendChild(t);});
    g.appendChild(label);
    g.addEventListener("pointerdown",e=>{
      if(e.button!==0)return;e.stopPropagation();
      pointerState={type:"node",node,startX:e.clientX,startY:e.clientY,originX:node.x,originY:node.y,moved:false};
      svg.setPointerCapture(e.pointerId);
    });
    nodesLayer.appendChild(g);
  }
  updateTransform();
}
function selectNode(id){selectedNodeId=id;renderGraph();const s=senseById(id),f=formById(id),fn=functionById(id);if(s)showSense(s);else if(f)showForm(f);else if(fn)showFunction(fn);}
function showSense(s){
  const f=formById(s.grammar_form_id),occ=data.grammar_occurrences.filter(o=>o.sense_id===s.id);
  const functions=data.function_links.filter(l=>l.sense_id===s.id).map(l=>functionById(l.function_id)).filter(Boolean);
  const rels=data.grammar_relations.filter(r=>r.source_id===s.id||r.target_id===s.id);
  let html=`<h2>${esc(f?.form)}：${esc(s.meaning)}</h2><h3>语法类别</h3><p>${esc(f?.category)}</p><h3>接续方式</h3><p>${esc(s.connection)}</p><h3>语法功能</h3><p>${functions.map(fn=>`<span class="badge">${esc(fn.name)}</span>`).join("")||"尚未分类"}</p><h3>教材课次与例句</h3>`;
  if(!occ.length)html+="<p>暂无教材记录。</p>";
  for(const o of occ){html+=`<div class="example"><strong>第${esc(o.lesson)}课</strong><span class="badge">页码：${o.page==null?"待核实":esc(o.page)}</span><div class="jp">${esc(o.example)}</div><div class="cn">${esc(o.translation)}</div><div class="notice">${o.source_type==="supplementary"?"教学补充例句，非已核实教材原句":"来源类型："+esc(o.source_type)}<br>${o.verified?"已核实":"教材出处尚未核实"}</div></div>`;}
  if(rels.length){html+="<h3>相关语法</h3>";for(const r of rels){const other=senseById(r.source_id===s.id?r.target_id:r.source_id),of=other?formById(other.grammar_form_id):null;html+=`<p><strong>${esc(of?.form)}：${esc(other?.meaning)}</strong><br>${esc(r.description)}<br><span class="badge">${r.type==="contrast"?"对比关系":"相关关系"}</span><span class="badge">${r.status==="proposed"?"待审核":esc(r.status)}</span></p>`;}}
  detailPanel.innerHTML=html;
}
function showForm(f){const senses=data.grammar_senses.filter(s=>s.grammar_form_id===f.id);detailPanel.innerHTML=`<h2>语法形式：${esc(f.form)}</h2><h3>语法类别</h3><p>${esc(f.category)}</p><h3>已收录义项</h3>${senses.map(s=>`<p><span class="badge">${esc(s.meaning)}</span></p>`).join("")}<p class="empty">点击绿色义项节点，查看例句与课次。</p>`;}
function showFunction(f){const items=data.function_links.filter(l=>l.function_id===f.id).map(l=>senseById(l.sense_id)).filter(Boolean);detailPanel.innerHTML=`<h2>${esc(f.name)}</h2><h3>相关语法</h3>${items.map(s=>`<p><span class="badge">${esc(formById(s.grammar_form_id)?.form)}</span>${esc(s.meaning)}</p>`).join("")}<p class="empty">点击义项查看详细内容。</p>`;}
function showWelcome(){detailPanel.innerHTML=`<h2>语法知识详情</h2><p class="empty">当前视图：<strong>${currentMode==="form"?"语法形式网络":"语法功能网络"}</strong><br>点击网络中的节点查看详细内容。</p><h3>节点说明</h3><p><span class="badge">黄色：当前中心</span><span class="badge">蓝色：语法形式</span><span class="badge">绿色：语法义项</span><span class="badge">紫色：语法功能</span></p><p class="empty">虚线表示相关语法之间的关系候选。</p>`;}
svg.addEventListener("pointerdown",e=>{if(e.button!==0)return;pointerState={type:"pan",startX:e.clientX,startY:e.clientY,originX:view.x,originY:view.y,moved:false};svg.setPointerCapture(e.pointerId);});
svg.addEventListener("pointermove",e=>{
  if(!pointerState)return;
  const dx=e.clientX-pointerState.startX,dy=e.clientY-pointerState.startY;
  if(Math.abs(dx)+Math.abs(dy)>4)pointerState.moved=true;
  if(pointerState.type==="pan"){view.x=pointerState.originX+dx;view.y=pointerState.originY+dy;updateTransform();}
  else if(pointerState.type==="node"){const n=pointerState.node;n.x=pointerState.originX+dx/view.scale;n.y=pointerState.originY+dy/view.scale;renderGraph();}
});
function endPointer(){if(!pointerState)return;const state=pointerState;pointerState=null;if(state.type==="node"&&!state.moved)selectNode(state.node.id);}
svg.addEventListener("pointerup",endPointer);svg.addEventListener("pointercancel",endPointer);svg.addEventListener("lostpointercapture",endPointer);
svg.addEventListener("wheel",e=>{e.preventDefault();const rect=svg.getBoundingClientRect(),mx=e.clientX-rect.left,my=e.clientY-rect.top,old=view.scale,factor=e.deltaY<0?1.1:.9,next=Math.min(3,Math.max(.2,old*factor));view.x=mx-(mx-view.x)/old*next;view.y=my-(my-view.y)/old*next;view.scale=next;updateTransform();},{passive:false});
document.getElementById("formBtn").addEventListener("click",()=>setMode("form"));
document.getElementById("functionBtn").addEventListener("click",()=>setMode("function"));
focusSelect.addEventListener("change",e=>{currentFocus=e.target.value;buildGraph();});
document.getElementById("resetBtn").addEventListener("click",()=>{layoutGraph();resetView();renderGraph();});
window.addEventListener("resize",()=>{if(!data)return;layoutGraph();resetView();renderGraph();});
async function init(){try{const r=await fetch(DATA_URL,{cache:"no-store"});if(!r.ok)throw new Error(`无法读取语法数据文件（HTTP ${r.status}）`);data=await r.json();for(const k of ["grammar_forms","grammar_senses","grammar_functions","function_links","grammar_occurrences","grammar_relations"]){if(!Array.isArray(data[k]))throw new Error(`数据结构缺少：${k}`);}setMode("form");}catch(err){console.error(err);detailPanel.innerHTML=`<h2>数据加载失败</h2><p class="notice">${esc(err.message)}</p>`;}}
init();
</script>
</body>
</html>
